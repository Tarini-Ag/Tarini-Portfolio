    // --- SEMESTER-WISE ACADEMIC PROGRESS CHART COMPONENT ---
    function SemesterProgressChart({ sems }) {
      const [hoveredSem, setHoveredSem] = useState(null);

      const svgWidth = 520;
      const svgHeight = 140;
      const paddingLeft = 55;
      const paddingRight = 35;
      const paddingTop = 22;
      const paddingBottom = 25;

      const minSGPA = 8.0;
      const maxSGPA = 10.0;

      const getX = (idx) => paddingLeft + (idx * (svgWidth - paddingLeft - paddingRight) / (sems.length - 1));
      const getY = (val) => {
        if (typeof val !== 'number') return svgHeight - paddingBottom;
        const norm = (val - minSGPA) / (maxSGPA - minSGPA);
        return svgHeight - paddingBottom - (norm * (svgHeight - paddingTop - paddingBottom));
      };

      const completedSems = sems.filter(s => typeof s.sgpa === 'number');
      const completedPath = completedSems.map((s, i) => `${i === 0 ? 'M' : 'L'} ${getX(i)} ${getY(s.sgpa)}`).join(' ');

      return (
        <div className="p-4 rounded-2xl bg-white dark:bg-dark-card border border-slate-200/90 dark:border-dark-border shadow-2xs space-y-2 relative font-sans">
          <div className="flex items-center justify-between font-mono text-2xs uppercase tracking-wider text-slate-500 dark:text-slate-400 border-b border-slate-100 dark:border-dark-border pb-2">
            <div className="flex items-center gap-2">
              <span className="w-2 h-2 rounded-full bg-blue-500" />
              <span className="font-bold text-slate-800 dark:text-slate-200 text-xs tracking-wide">Academic Progression (SGPA Trend)</span>
            </div>
            <span className="text-[11px] font-semibold text-emerald-600 dark:text-emerald-400 bg-emerald-50 dark:bg-emerald-950/50 px-2 py-0.5 rounded-lg border border-emerald-200/80 dark:border-emerald-500/30">
              Peak: 9.14 SGPA
            </span>
          </div>

          <div className="relative w-full overflow-hidden">
            <svg viewBox={`0 0 ${svgWidth} ${svgHeight}`} className="w-full h-auto overflow-visible select-none">
              {/* Grid Lines */}
              <line x1={paddingLeft - 10} y1={getY(10.0)} x2={svgWidth - paddingRight} y2={getY(10.0)} stroke="#E2E8F0" className="dark:stroke-slate-800" strokeDasharray="3 3" />
              <line x1={paddingLeft - 10} y1={getY(9.0)} x2={svgWidth - paddingRight} y2={getY(9.0)} stroke="#E2E8F0" className="dark:stroke-slate-800" strokeDasharray="3 3" />
              <line x1={paddingLeft - 10} y1={getY(8.5)} x2={svgWidth - paddingRight} y2={getY(8.5)} stroke="#E2E8F0" className="dark:stroke-slate-800" strokeDasharray="3 3" />

              {/* Y Axis Labels */}
              <text x={paddingLeft - 18} y={getY(10.0) + 4} textAnchor="end" className="text-[9px] font-mono fill-slate-400">10.0</text>
              <text x={paddingLeft - 18} y={getY(9.0) + 4} textAnchor="end" className="text-[9px] font-mono fill-slate-400">9.0</text>

              {sems.map((s, idx) => {

                const isCompleted = typeof s.sgpa === 'number';
                const cy = isCompleted ? getY(s.sgpa) : getY(8.86);
                const isHovered = hoveredSem?.sem === s.sem;

                return (
                  <g key={s.sem} className="cursor-pointer" onMouseEnter={() => setHoveredSem(s)} onMouseLeave={() => setHoveredSem(null)}>

                      <text x={cx} y={cy - 9} textAnchor="middle" className="text-[9px] font-mono font-extrabold fill-slate-800 dark:fill-slate-100">{s.sgpa}</text>

                    <text x={cx} y={svgHeight - 4} textAnchor="middle" className={`text-[10px] font-mono ${isHovered ? 'fill-blue-600 font-bold' : 'fill-slate-500 dark:fill-slate-400'}`}>
                      {s.label}
                    </text>
                  </g>
                );
              })}
            </svg>
          </div>

          {hoveredSem ? (
            <div className="mt-1 p-2.5 rounded-xl bg-slate-900/95 dark:bg-dark-surface/95 text-white border border-slate-700/80 shadow-xl font-mono text-2xs space-y-1 backdrop-blur-md animate-fadeIn">

        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        let mouseX = -1000;
        let mouseY = -1000;

        const handleMouseMove = (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
        };
        const handleMouseLeave = () => {
          mouseX = -1000;
          mouseY = -1000;
        };
        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
          initParticles();
        };
        window.addEventListener('resize', handleResize);

        const offCanvas = document.createElement('canvas');
        const offCtx = offCanvas.getContext('2d');

        let particles = [];

        const initParticles = () => {
          offCanvas.width = width;
          offCanvas.height = height;
          offCtx.clearRect(0, 0, width, height);

          const centerY = height * 0.28;

          offCtx.fillStyle = '#FFFFFF';
          offCtx.font = 'bold 58px Inter, sans-serif';
          offCtx.textAlign = 'center';
          offCtx.fillText('Tarini Agarwal', width / 2, centerY);

          offCtx.font = '600 16px "JetBrains Mono", monospace';
          offCtx.fillText('Data Scientist • AI Engineer • Storyteller', width / 2, centerY + 50);

          offCtx.font = '500 20px Inter, sans-serif';
          offCtx.fillText('Every dataset tells a story.', width / 2, centerY + 95);
          offCtx.font = '600 20px Inter, sans-serif';
          offCtx.fillText('This dataset tells mine.', width / 2, centerY + 125);

          const imgData = offCtx.getImageData(0, 0, width, height);
          const data = imgData.data;

          const targets = [];
          const step = Math.max(6, Math.floor(width / 220));

          for (let y = 0; y < height; y += step) {
            for (let x = 0; x < width; x += step) {
              const alpha = data[(y * width + x) * 4 + 3];
              if (alpha > 128) {
                let color = '#FFFFFF';
                let fontSize = 14;
                if (y < centerY + 20) {
                  const ratio = (x - (width / 2 - 200)) / 400;
                  if (ratio < 0.3) color = '#3882F6';
                  else if (ratio < 0.7) color = '#06B6D4';
                  else color = '#00FF66';
                  fontSize = 16;
                } else if (y < centerY + 70) {
                  color = '#34D399';
                  fontSize = 12;
                } else if (y > centerY + 110) {
                  color = '#00FF66';
                  fontSize = 14;
                }

                targets.push({ x, y, color, fontSize });
              }
            }
          }

          particles = targets.map((t) => {
            const startX = Math.random() * width;
            const startY = Math.random() * -height;
            return {
              x: startX,
              y: startY,
              vx: (Math.random() - 0.5) * 0.8,
              vy: Math.random() * 1.5 + 1.2,
              tx: t.x,
              ty: t.y,
              targetColor: t.color,
              char: Math.random() > 0.5 ? '1' : '0',
              size: t.fontSize,
              baseOpacity: Math.random() * 0.5 + 0.5,
              glow: Math.random() > 0.95
            };
          });

          const ambientCount = 350;
          for (let i = 0; i < ambientCount; i++) {
            particles.push({
              x: Math.random() * width,
              y: Math.random() * height,
              vx: (Math.random() - 0.5) * 0.4,
              vy: Math.random() * 0.8 + 0.4,
              tx: null,
              ty: null,
              targetColor: '#108991',
              char: Math.random() > 0.5 ? '1' : '0',
              size: 13,
              baseOpacity: Math.random() * 0.3 + 0.1,
              glow: false
            });
          }
        };

        initParticles();

        let animationFrameId;
        let startTime = performance.now();

        const draw = (now) => {
          const elapsed = (now - startTime) / 1000;
          const cycleDuration = 12.0;
          const cycleTime = elapsed % cycleDuration;

          let assemblyProgress = 0;
          if (cycleTime >= 3.0 && cycleTime < 5.5) {
            assemblyProgress = (cycleTime - 3.0) / 2.5;
            assemblyProgress = Math.pow(assemblyProgress, 2);
          } else if (cycleTime >= 5.5 && cycleTime < 9.5) {
            assemblyProgress = 1.0;
          } else if (cycleTime >= 9.5 && cycleTime < 11.5) {
            assemblyProgress = 1.0 - ((cycleTime - 9.5) / 2.0);
          } else {
            assemblyProgress = 0;
          }

          ctx.fillStyle = 'rgba(8, 12, 20, 0.35)';
          ctx.fillRect(0, 0, width, height);

          for (let i = 0; i < particles.length; i++) {
            const p = particles[i];

            p.y += p.vy;
            p.x += p.vx;

            if (p.y > height + 20) {
              p.y = Math.random() * -50;
              p.x = Math.random() * width;
            }

            let renderX = p.x;
            let renderY = p.y;

            if (p.tx !== null && assemblyProgress > 0) {
              const targetX = p.tx;
              const targetY = p.ty;

              renderX = p.x * (1 - assemblyProgress) + targetX * assemblyProgress;
              renderY = p.y * (1 - assemblyProgress) + targetY * assemblyProgress;
            }

            const dx = renderX - mouseX;
            const dy = renderY - mouseY;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const maxDist = 140;

            if (dist < maxDist && dist > 0) {
              const force = (1 - dist / maxDist) * 35;
              renderX += (dx / dist) * force;
              renderY += (dy / dist) * force;
            }

            if (Math.random() > 0.995) {
              p.char = p.char === '1' ? '0' : '1';
            }

            ctx.font = `bold ${p.size}px "JetBrains Mono", monospace`;

            if (assemblyProgress > 0.5 && p.tx !== null) {
              ctx.fillStyle = p.targetColor;
              if (p.glow) {
                ctx.shadowColor = p.targetColor;
                ctx.shadowBlur = 6;
              } else {
                ctx.shadowBlur = 0;
              }
            } else {
              ctx.fillStyle = p.glow ? '#00FF66' : `rgba(52, 211, 153, ${p.baseOpacity})`;
              ctx.shadowColor = p.glow ? '#00FF66' : 'transparent';
              ctx.shadowBlur = p.glow ? 4 : 0;
            }

            ctx.fillText(p.char, renderX, renderY);
          }

          animationFrameId = requestAnimationFrame(draw);
        };

        animationFrameId = requestAnimationFrame(draw);

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      return <canvas ref={canvasRef} className="absolute inset-0 pointer-events-none z-0 opacity-95" />;
    }

    // --- LIGHT MODE LANDING CANVAS ---
    function InteractiveSlowRainCanvas({ isDark }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        let mouseX = -1000;
        let mouseY = -1000;

        const handleMouseMove = (e) => {
          mouseX = e.clientX;
          mouseY = e.clientY;
        };

        const handleMouseLeave = () => {
          mouseX = -1000;
          mouseY = -1000;
        };

        window.addEventListener('mousemove', handleMouseMove);
        window.addEventListener('mouseleave', handleMouseLeave);

        const fontSize = 15;
        const cols = Math.ceil(width / (fontSize * 1.1));
        const rows = Math.ceil(height / (fontSize * 1.2)) + 4;

        const colOffsets = Array.from({ length: cols }, () => Math.random() * 100);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        let animationFrameId;

        const draw = () => {
          ctx.fillStyle = isDark ? 'rgba(8, 12, 20, 0.28)' : 'rgba(248, 250, 252, 0.28)';
          ctx.fillRect(0, 0, width, height);

          ctx.font = `bold ${fontSize}px "JetBrains Mono", monospace`;

          for (let c = 0; c < cols; c++) {
            colOffsets[c] += 0.12;
            const offset = colOffsets[c];

            for (let r = -2; r < rows; r++) {
              const origY = ((r + offset) * (fontSize * 1.2)) % (height + fontSize * 3) - fontSize;
              const origX = c * (fontSize * 1.1);

              const dx = origX - mouseX;
              const dy = origY - mouseY;
              const dist = Math.sqrt(dx * dx + dy * dy);
              const maxDist = 160;

              let renderX = origX;
              let renderY = origY;

              if (dist < maxDist && dist > 0) {
                const force = ((maxDist - dist) / maxDist) * 40;
                renderX += (dx / dist) * force;
                renderY += (dy / dist) * force;
              }

              const char = ((c * 13 + r * 29 + Math.floor(offset * 0.5)) % 2 === 0) ? '1' : '0';
              let opacity = 0.15 + (Math.sin(c * 0.4 + r * 0.2 + offset * 0.1) * 0.15 + 0.15);

              if (dist < maxDist) {
                opacity = Math.min(1, opacity + 0.35);
              }

              ctx.fillStyle = `rgba(16, 137, 145, ${opacity + 0.15})`;
              ctx.shadowBlur = 0;

              ctx.fillText(char, renderX, renderY);
            }
          }

          animationFrameId = requestAnimationFrame(draw);
        };

        draw();

        return () => {
          window.removeEventListener('mousemove', handleMouseMove);
          window.removeEventListener('mouseleave', handleMouseLeave);
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, [isDark]);

      return <canvas ref={canvasRef} className="absolute inset-0 pointer-events-none z-0 opacity-90" />;
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [screen, setScreen] = useState(1);
      const [isDark, setIsDark] = useState(false);
      const [selectedCert, setSelectedCert] = useState(null);
      const [currentView, setCurrentView] = useState('dataset'); // 'dataset', 'resume'

      const toggleTheme = () => {
        const nextDark = !isDark;
        setIsDark(nextDark);
        if (nextDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.classList.add('light');
        }
      };

      const handleSelectCert = (cert) => {
        setSelectedCert(cert);
      };

      const handleBackToDataset = () => {
        setSelectedCert(null);
        setCurrentView('dataset');
      };

      return (
        <React.Fragment>
          {selectedCert ? (
            <ScreenCertificateDetail
              cert={selectedCert}
              onBack={handleBackToDataset}
              highlightText={(txt) => txt}
            />
          ) : currentView === 'resume' ? (
            <ScreenResume onBack={handleBackToDataset} />
          ) : (
            <React.Fragment>
              {screen === 1 && <Screen1 onRun={() => setScreen(2)} isDark={isDark} onToggleTheme={toggleTheme} />}
              {screen === 2 && <Screen2 onComplete={() => setScreen(3)} />}
              {screen === 3 && (
                <Screen3
                  isDark={isDark}
                  onToggleTheme={toggleTheme}
                  onSelectCert={handleSelectCert}
                  onOpenResume={() => setCurrentView('resume')}
                />
              )}
            </React.Fragment>
          )}
        </React.Fragment>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
